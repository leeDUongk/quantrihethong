# =====================================================================
# Bai lab 8 -- Alerting rules
#
# Moi rule deu co chu thich vi sao chon bieu thuc va nguong do. Bon cho
# danh dau "CAI BAY" la nhung loi thuong gap khi viet alert rule: chung
# KHONG lam Prometheus bao loi, nen neu khong biet truoc thi rat kho
# nhan ra. Buoc 8 cua tai lieu huong dan tu kiem tung cai.
#
# Kiem cu phap:
#   docker compose exec prometheus promtool check rules \
#     /etc/prometheus/rules/alerts.yml
# =====================================================================

groups:

# ---------------------------------------------------------------------
- name: dich-vu
  rules:

  # Chi so "up" do CHINH Prometheus sinh ra cho moi target: 1 la lay so
  # lieu duoc, 0 la khong. Day la canh bao quan trong nhat cua ca he
  # thong, va cung la cai de kiem chung nhat -- dung mot container la no
  # keu sau mot phut.
  - alert: DichVuChet
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Dich vu {{ $labels.job }} khong tra loi"
      description: "Prometheus khong lay duoc so lieu tu {{ $labels.instance }} (job {{ $labels.job }}) trong hon mot phut."

# ---------------------------------------------------------------------
- name: container
  rules:

  # ===== CAI BAY 1: SAI TEN NHAN =====
  # cAdvisor gan nhan "name", KHONG phai "container". Viet nham thanh
  #   container_cpu_usage_seconds_total{container="wordpress"}
  # thi bieu thuc khong khop chuoi nao ca, va Prometheus KHONG bao loi --
  # voi no, "bieu thuc tra ve rong" la ket qua hoan toan hop le. Rule cu
  # nam im mai mai, o giao dien Alerts hien INACTIVE mau xanh, trong y
  # het mot rule khoe manh dang canh gac.
  - alert: ContainerCPUCao
    expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[2m])) * 100 > 70
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Container {{ $labels.name }} dang an CPU"
      description: "CPU cua {{ $labels.name }} vuot 70% lien tuc hai phut (hien tai {{ $value | printf \"%.1f\" }}%)."

  # ===== CAI BAY 2: CHIA CHO KHONG =====
  # Mot cach viet thuong gap la so muc dung RAM voi GIOI HAN cua container:
  #   container_memory_usage_bytes{...} / container_spec_memory_limit_bytes{...} * 100 > 85
  # container_spec_memory_limit_bytes bang 0 khi container KHONG dat gioi
  # han RAM -- dung truong hop cua bai lab. Trong Prometheus, mot so duong
  # chia cho 0 ra +Inf, va "+Inf > 85" la DUNG. Ket qua: canh bao keu ngay
  # tu giay dau tien va keu mai mai. Con te hon la khong keu, vi sau vai
  # ngay ai cung quen mat va bo qua no.
  #
  # Cach viet o day: so voi RAM THAT cua may ao thay vi so voi mot gioi
  # han khong ton tai. scalar() bien chuoi mot phan tu thanh mot so, nho
  # vay phep chia giu nguyen nhan "name" cua ve trai -- neu chia hai
  # vector cho nhau, Prometheus ghep theo nhan va ket qua se la RONG.
  - alert: ContainerAnNhieuRAM
    expr: sum by (name) (container_memory_working_set_bytes{name!=""}) / scalar(node_memory_MemTotal_bytes) * 100 > 20
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: "Container {{ $labels.name }} chiem nhieu RAM may"
      description: "{{ $labels.name }} dang giu hon 20% RAM cua may ao ({{ $value | printf \"%.1f\" }}%)."

# ---------------------------------------------------------------------
- name: mysql
  rules:

  # ===== CAI BAY 3: CHI SO KHONG TON TAI =====
  # De viet nham thanh mysql_global_status_errors_total -- mot cai ten
  # nghe rat hop ly nhung mysqld_exporter KHONG he co. Prometheus khong
  # bao gio bao "chi so nay khong ton tai": voi no, mot chi so chua tung
  # xuat hien va mot chi so hien khong co du lieu la cung mot thu.
  # Luon kiem ten truoc khi viet rule:
  #   curl -s localhost:9090/api/v1/label/__name__/values | grep mysql_global_status_conn
  - alert: MySQLNhieuLoiKetNoi
    expr: rate(mysql_global_status_connection_errors_total[5m]) > 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "MySQL dang tu choi ket noi"
      description: "Hon mot loi ket noi moi giay trong hai phut -- kiem mat khau ung dung hoac so ket noi toi da."

  # ===== CAI BAY 4: NGUONG TUYET DOI =====
  # Viet "threads_connected > 80" chi dung khi max_connections dung bang
  # mac dinh 151. Hom nao nguoi quan tri nang no len 500 thi rule do thanh
  # bao dong gia thuong truc. Nguong theo PHAN TRAM con dung trong moi
  # truong hop, va no tu noi len y nghia: "dang dung bao nhieu phan tram
  # tran" -- doc la hieu, khong phai nho tran bang bao nhieu.
  - alert: MySQLSapCanKetNoi
    expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections * 100 > 60
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "MySQL sap can so ket noi cho phep"
      description: "Da dung {{ $value | printf \"%.0f\" }}% so ket noi toi da. Cham tran la ung dung bao 'Too many connections'."

  # mysql_up = 0 nghia la exporter con song va van tra loi Prometheus,
  # nhung KHONG dang nhap duoc vao MySQL. Khac han voi DichVuChet o tren.
  - alert: MySQLKhongDangNhapDuoc
    expr: mysql_up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Exporter khong vao duoc MySQL"
      description: "Exporter song nhung mu: sai mat khau, tai khoan bi khoa, hoac MySQL tu choi ket noi."

# ---------------------------------------------------------------------
- name: may-chu
  rules:

  - alert: DiaSapDay
    expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"} < 15
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "O dia {{ $labels.mountpoint }} con duoi 15%"
      description: "Con {{ $value | printf \"%.1f\" }}% dung luong. Prometheus va Loki deu ghi lien tuc, het dia la ca hai cung chet."

  - alert: RAMMayChuCao
    expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "May ao sap het RAM"
      description: "Da dung {{ $value | printf \"%.0f\" }}% RAM trong nam phut."
