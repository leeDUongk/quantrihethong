# =====================================================================
# Bai lab 8 -- Cau hinh thu thap chi so VA canh bao
#
# So voi bai 7, file nay them DUNG HAI KHOI: "alerting" va "rule_files".
# Phan scrape_configs giu nguyen hoan toan -- bai 8 khong them chi so
# nao, no chi dat them mot tang canh bao len tren cac chi so da co.
#
# Kiem cu phap TRUOC khi nap lai:
#   docker compose exec prometheus promtool check config \
#     /etc/prometheus/prometheus.yml
# =====================================================================

global:
  scrape_interval: 15s
  # Bao lau mot lan Prometheus DOI CHIEU cac rule voi du lieu. Khac
  # scrape_interval: mot ben la "lay so lieu ve", mot ben la "xet xem so
  # lieu da vuot nguong chua".
  evaluation_interval: 15s
  external_labels:
    may: 'lab-MSSV'

# ===================== MOI O BAI 8 =====================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - "/etc/prometheus/rules/*.yml"

# =======================================================

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Giam sat chinh he canh bao. Neu Alertmanager chet ma khong ai biet
  # thi he thong im lang -- va "im lang" bi hieu nham thanh "khong co su
  # co". Day la kieu hong nguy hiem nhat cua mot he canh bao.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Loki cung phoi chi so cua chinh no.
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
